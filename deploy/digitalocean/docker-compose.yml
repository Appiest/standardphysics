# Standard Physics on one DigitalOcean Droplet.
#
#   cd deploy/digitalocean && docker compose up -d --build
#
# Three containers: Caddy holds the certificates and is the only one bound to
# a public port, the API holds the scans, and the workspace serves the pages.
# The two application containers come from the one image at the repository
# root, the same image the compose file up there builds.
#
# Scans live on the attached Block Storage volume rather than the Droplet's
# own disk, so the disk can be resized or the Droplet rebuilt without losing
# a shop. SCANS_PATH is where the volume is mounted; setup.sh sets it.
#
# The image is standardphysics:<sha>, the commit it came from, as well as
# :latest. scripts/deploy.sh fills that tag by pulling the image CI tested,
# ghcr.io/imhaohao/standardphysics:<sha>, and tagging it under this local name,
# so this file never names a registry and runs the same whether the image was
# pulled or built. The build section below is used only when SP_DEPLOY_BUILD=1
# asks for an untested build on the box, or by hand. GIT_SHA picks the tag: deploy.sh
# sets it from `git rev-parse HEAD`, and a rollback is `git checkout <sha>` and
# `GIT_SHA=<sha> docker compose up -d`, which finds that tag already on the box
# and starts it without a rebuild. Without GIT_SHA it falls back to :latest.
#
# Memory and CPU limits are sized for a 2 vCPU, 4 GB Droplet, whose kernel
# keeps a little of the 4 GB for itself, with the 2 GB of swap setup.sh adds
# behind it:
#
#   api   3.2 GB, plus 1 GB of swap. A photo bake of a whole floor peaks near
#         3 GB, and it runs inside this container on top of the server, so
#         the limit sits just above the bake. The swap allowance lets a bake
#         that runs a little over slow down instead of being killed.
#   web   512 MB, plus 256 MB of swap. The workspace renders pages and holds
#         no scans, so this is a ceiling for a leak, not a working size.
#   rest  Caddy, Docker itself, sshd and the kernel have no limit and take
#         what is left. With both containers at their ceilings that is only
#         a couple of hundred MB, and swap covers the difference. Both at
#         once is unlikely, because only the API does heavy work.
#
# The limits are there so a runaway process dies inside its own container.
# Without them the kernel's OOM killer picks from the whole box, and Docker,
# sshd and Caddy are all on its list.
#
# For CPU, the bake runs one thread per core. 1.75 cores keeps a quarter of a
# core free for Caddy and SSH while a bake has the box, and costs the bake up
# to an eighth of its speed. The workspace gets one core, so a burst of page
# renders cannot take the bake's second one.
#
# Docker keeps every line a container prints in a json-file on the Droplet
# disk, and by default never deletes any of it. Each service below keeps at
# most five 20 MB files, 100 MB per container, which is days of API logs even
# through a busy bake. `docker compose logs` reads the same files, so what it
# can show goes back that far and no further.

x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    logging: *rotated-logs
    ports:
      - "80:80"
      - "443:443"
    # Every download leaves through this container's own network namespace,
    # which does not follow the host's choice; setup.sh loads the module.
    sysctls:
      net.ipv4.tcp_congestion_control: bbr
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-certificates:/data
      - caddy-state:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
      tags:
        - standardphysics:latest
    image: standardphysics:${GIT_SHA:-latest}
    command: ["api"]
    restart: unless-stopped
    logging: *rotated-logs
    mem_limit: 3200m
    memswap_limit: 4200m
    cpus: 1.75
    env_file: .env
    environment:
      SP_API_PORT: "8787"
      SP_DATA_DIR: /data
      # Caddy sends X-Forwarded-Proto, and uvicorn ignores it unless the hop it
      # came from is trusted. Without this the API believes every request
      # arrived over plain HTTP and hands back a session cookie without the
      # Secure flag. Trusting any hop is safe here because the API publishes no
      # port: nothing but Caddy can reach it.
      FORWARDED_ALLOW_IPS: "*"
      # The photo bake's threads each keep their own pool of freed memory, and
      # with the default of one pool per thread a floor's bake crept up atlas by
      # atlas until the droplet killed it. Two pools hold that creep down.
      MALLOC_ARENA_MAX: "2"
      # The bake already runs one worker thread per core. OpenBLAS starting its
      # own threads inside each one made two cores fight over every matrix
      # product: 153 ms per transform instead of 85 on the droplet.
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      # create_host_path: false is the whole point of the long form here. The
      # short form lets Docker invent a missing directory, owned by root, which
      # the container cannot write to: the API then fails to create its database
      # and exits, and the only symptom anyone sees is Caddy reporting that its
      # dependency did not start. Refusing to start is the better answer.
      - type: bind
        source: ${SCANS_PATH:?set SCANS_PATH in .env}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: standardphysics:${GIT_SHA:-latest}
    command: ["web"]
    restart: unless-stopped
    logging: *rotated-logs
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    environment:
      PORT: "3000"
      SP_API_ORIGIN: http://api:8787
    # The image's own healthcheck asks port 8787 for /health, which is the API
    # and not this. Inherited unchanged, the workspace reports unhealthy while
    # serving every page correctly, and a status column that is always wrong is
    # one nobody reads on the day it is right.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy-certificates:
  caddy-state:
