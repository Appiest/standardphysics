# setup.sh installs this as /etc/logrotate.d/standardphysics.
#
# The deploy log gains one line of about 130 bytes per deploy, so 1 MB is
# thousands of deploys and it rotates rarely. delaycompress leaves the newest
# old file readable as plain text, because deploy.sh reads its last line to
# name a rollback when the current file was just rotated and is still empty.
/var/log/standardphysics-deploys.log {
    size 1M
    rotate 10
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}
