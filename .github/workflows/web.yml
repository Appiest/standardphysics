name: Web and contracts

on:
  push:
    paths:
      - "packages/contracts/**"
      - "apps/web/**"
      - "services/api/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - "apps/web/**"
      - "services/api/**"
      - ".github/workflows/web.yml"

jobs:
  contracts:
    name: Generated types match the contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install pydantic==2.13.5 pydantic-core==2.46.5 -e packages/contracts
      - run: npm ci
        working-directory: apps/web
      - run: npm run contracts
        working-directory: apps/web
        env:
          PYTHON: python
      - name: Fail if a contract changed without regenerating
        run: git diff --exit-code -- apps/web/src/types/contracts.ts

  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: Owner flow in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    env:
      PYTHON: python
      SP_SEED_OWNER_PASSWORD: playwright-demo-owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install the API
        working-directory: .
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e tools/loopforge -e packages/contracts -e packages/fixtures -e packages/pipeline -e packages/agents -e services/api
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
