name: iOS app

# OwnerAPI.swift mirrors packages/contracts by hand, and the tests bundle the
# two RoomPlan fixtures below, so either changing can break this build.
# LiveOwnerFlowTests walks datasets/phone/test1 through a real API started from
# services/api, so a change to the API or its pinned dependencies can too.
on:
  push:
    paths:
      - "apps/ios/**"
      - "packages/contracts/**"
      - "packages/fixtures/standardphysics_fixtures/data/real/apple_bedroom3.room.json"
      - "packages/fixtures/standardphysics_fixtures/data/real/apple_livingroom.room.json"
      - "services/api/**"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "datasets/phone/test1/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/contracts/**"
      - "packages/fixtures/standardphysics_fixtures/data/real/apple_bedroom3.room.json"
      - "packages/fixtures/standardphysics_fixtures/data/real/apple_livingroom.room.json"
      - "services/api/**"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "datasets/phone/test1/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  XCODEGEN_VERSION: 2.45.3
  LIVE_API: http://127.0.0.1:8798

jobs:
  simulator:
    name: Build and test on the simulator
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      # project.pbxproj is committed as XcodeGen writes it, so a project.yml
      # edit without regenerating shows up here instead of on someone's laptop.
      - name: Fail if the Xcode project is stale against project.yml
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- .
      # The runner image does not always list the same simulators, and twice it
      # listed none, so a fixed device name failed the build before any test
      # ran. This takes any available iPhone, or creates one on the newest iOS
      # runtime installed, and targets it by id.
      - name: Pick or create an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for r,ds in sorted(d.items(), reverse=True) if 'iOS' in r for x in ds if x['name'].startswith('iPhone')), ''))")
          if [ -z "$udid" ]; then
            read -r runtime device < <(xcrun simctl list runtimes available -j | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['platform']=='iOS']; r=rs[-1] if rs else None; phones=[d['identifier'] for d in (r or {}).get('supportedDeviceTypes', []) if d['name'].startswith('iPhone')]; print(r['identifier'], phones[-1]) if r and phones else print('')")
            [ -n "$runtime" ] || { echo "no iOS simulator runtime with an iPhone is installed on this runner" >&2; exit 1; }
            udid=$(xcrun simctl create "CI iPhone" "$device" "$runtime")
          fi
          echo "SIMULATOR=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$udid"
      # Ad hoc signing rather than none: an unsigned simulator build has no
      # Keychain access, so SessionStore could never keep a token and the live
      # owner flow would fail at its first sign-in.
      - name: Build the app and tests
        run: >
          xcodebuild build-for-testing
          -project StandardPhysics.xcodeproj
          -scheme StandardPhysics
          -destination "$SIMULATOR"
          -derivedDataPath build/DerivedData
          CODE_SIGN_IDENTITY=-
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the API from the pinned lock
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e tools/loopforge -e packages/contracts -e packages/fixtures -e packages/pipeline -e packages/agents -e services/api
      # A fresh, empty data directory each run, so the live tests only ever
      # see the guest accounts and shops they make themselves.
      - name: Start a throwaway API for the live tests
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/live-api-data"
          SP_DATA_DIR="$RUNNER_TEMP/live-api-data" SP_API_HOST=127.0.0.1 SP_API_PORT=8798 \
            nohup python -m standardphysics_api > "$RUNNER_TEMP/live-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/live-api.pid"
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors "$LIVE_API/health"
      # xcodebuild hands TEST_RUNNER_ variables to the test process with the
      # prefix removed, which is how SP_LIVE_API reaches LiveOwnerFlowTests.
      # LiveReportPDFTests still skips: it needs a report link on a running web.
      - name: Run StandardPhysicsTests
        shell: bash
        env:
          TEST_RUNNER_SP_LIVE_API: ${{ env.LIVE_API }}
        run: >
          xcodebuild test-without-building
          -project StandardPhysics.xcodeproj
          -scheme StandardPhysics
          -destination "$SIMULATOR"
          -derivedDataPath build/DerivedData
          -resultBundlePath build/StandardPhysicsTests.xcresult
          | tee "$RUNNER_TEMP/tests.log"
      - name: Fail if the live owner flow skipped
        run: grep -q "LiveOwnerFlowTests testAGuestWalksAnswersSavesAndKeepsTheShop\]' passed" "$RUNNER_TEMP/tests.log"
      - name: Stop the API
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/live-api.pid")" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: StandardPhysicsTests.xcresult
          path: |
            apps/ios/build/StandardPhysicsTests.xcresult
            ${{ runner.temp }}/live-api.log
