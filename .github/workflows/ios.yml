name: iOS app

# OwnerAPI.swift mirrors packages/contracts by hand, and the tests bundle two
# RoomPlan fixtures from packages/fixtures, so either changing can break this
# build. The sample shop the live report is made from comes from there too.
# LiveOwnerFlowTests walks datasets/phone/test1 through a real API started from
# services/api, which imports packages/agents and packages/pipeline, so a
# change to any of those or to their pinned dependencies can too.
# LiveReportPDFTests prints a report link served by apps/web.
on:
  push:
    paths:
      - "apps/ios/**"
      - "packages/contracts/**"
      - "packages/fixtures/**"
      - "packages/agents/**"
      - "packages/pipeline/**"
      - "services/api/**"
      - "apps/web/**"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "datasets/phone/test1/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/contracts/**"
      - "packages/fixtures/**"
      - "packages/agents/**"
      - "packages/pipeline/**"
      - "services/api/**"
      - "apps/web/**"
      - "requirements.lock"
      - "requirements-dev.lock"
      - "datasets/phone/test1/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  XCODEGEN_VERSION: 2.45.3
  LIVE_API: http://127.0.0.1:8798
  LIVE_WEB: http://127.0.0.1:3398

jobs:
  simulator:
    name: Build and test on the simulator
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: xcodebuild -version
      # project.pbxproj is committed as XcodeGen writes it, so a project.yml
      # edit without regenerating shows up here instead of on someone's laptop.
      - name: Fail if the Xcode project is stale against project.yml
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          git diff --exit-code -- .
      # The runner image does not always list the same simulators, and twice it
      # listed none, so a fixed device name failed the build before any test
      # ran. This takes any available iPhone, or creates one on the newest iOS
      # runtime installed, and targets it by id.
      - name: Pick or create an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for r,ds in sorted(d.items(), reverse=True) if 'iOS' in r for x in ds if x['name'].startswith('iPhone')), ''))")
          if [ -z "$udid" ]; then
            read -r runtime device < <(xcrun simctl list runtimes available -j | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['platform']=='iOS']; r=rs[-1] if rs else None; phones=[d['identifier'] for d in (r or {}).get('supportedDeviceTypes', []) if d['name'].startswith('iPhone')]; print(r['identifier'], phones[-1]) if r and phones else print('')")
            [ -n "$runtime" ] || { echo "no iOS simulator runtime with an iPhone is installed on this runner" >&2; exit 1; }
            udid=$(xcrun simctl create "CI iPhone" "$device" "$runtime")
          fi
          echo "SIMULATOR=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$udid"
      # Ad hoc signing rather than none: an unsigned simulator build has no
      # Keychain access, so SessionStore could never keep a token and the live
      # owner flow would fail at its first sign-in.
      - name: Build the app and tests
        run: >
          xcodebuild build-for-testing
          -project StandardPhysics.xcodeproj
          -scheme StandardPhysics
          -destination "$SIMULATOR"
          -derivedDataPath build/DerivedData
          CODE_SIGN_IDENTITY=-
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the API from the pinned lock
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e tools/loopforge -e packages/contracts -e packages/fixtures -e packages/pipeline -e packages/agents -e services/api
      # A fresh data directory each run, holding only the sample shop, which
      # belongs to its own demo account. The live owner flow signs in as fresh
      # guests, so it still only ever sees the shops it makes itself.
      - name: Start a throwaway API for the live tests
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/live-api-data"
          SEED_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$SEED_PASSWORD"
          echo "SEED_PASSWORD=$SEED_PASSWORD" >> "$GITHUB_ENV"
          SP_DATA_DIR="$RUNNER_TEMP/live-api-data" SP_API_HOST=127.0.0.1 SP_API_PORT=8798 \
            SP_SEED_SAMPLE_SHOP=1 SP_SEED_OWNER_PASSWORD="$SEED_PASSWORD" \
            nohup python -m standardphysics_api > "$RUNNER_TEMP/live-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/live-api.pid"
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors "$LIVE_API/health"
      # The demo owner shares the sample shop the way the Share button does,
      # and the link is kept once the worker has assessed the shop, so the
      # page LiveReportPDFTests prints has its findings on it.
      - name: Share the sample shop's report
        run: |
          jar="$RUNNER_TEMP/demo-owner.cookies"
          curl -fsS -c "$jar" -H 'Content-Type: application/json' \
            -d "{\"email\": \"demo@standardphysics.app\", \"password\": \"$SEED_PASSWORD\"}" \
            "$LIVE_API/api/auth/sign-in" > /dev/null
          scan=$(curl -fsS -b "$jar" "$LIVE_API/api/scans" | python3 -c "import json,sys; print(json.load(sys.stdin)['scans'][0]['id'])")
          path=$(curl -fsS -b "$jar" -X POST "$LIVE_API/api/scans/$scan/shares" | python3 -c "import json,sys; print(json.load(sys.stdin)['path'])")
          for _ in $(seq 1 120); do
            curl -fsS "$LIVE_API/api/shared/${path#/r/}" | python3 -c "import json,sys; sys.exit(json.load(sys.stdin)['assessment'] is None)" && break
            sleep 1
          done
          curl -fsS "$LIVE_API/api/shared/${path#/r/}" | python3 -c "import json,sys; sys.exit(json.load(sys.stdin)['assessment'] is None)"
          echo "LIVE_REPORT=$LIVE_WEB$path" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # next build writes the /api rewrite's destination into its manifest, so
      # SP_API_ORIGIN has to name the throwaway API at build time.
      - name: Build and start the web app
        working-directory: apps/web
        env:
          SP_API_ORIGIN: ${{ env.LIVE_API }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npm start -- --hostname 127.0.0.1 --port 3398 > "$RUNNER_TEMP/live-web.log" 2>&1 &
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors -o /dev/null "$LIVE_REPORT"
      # xcodebuild hands TEST_RUNNER_ variables to the test process with the
      # prefix removed, which is how SP_LIVE_API reaches LiveOwnerFlowTests
      # and SP_LIVE_REPORT reaches LiveReportPDFTests.
      - name: Run StandardPhysicsTests
        shell: bash
        env:
          TEST_RUNNER_SP_LIVE_API: ${{ env.LIVE_API }}
          TEST_RUNNER_SP_LIVE_REPORT: ${{ env.LIVE_REPORT }}
        run: >
          xcodebuild test-without-building
          -project StandardPhysics.xcodeproj
          -scheme StandardPhysics
          -destination "$SIMULATOR"
          -derivedDataPath build/DerivedData
          -resultBundlePath build/StandardPhysicsTests.xcresult
          | tee "$RUNNER_TEMP/tests.log"
      - name: Fail if a live test skipped
        run: |
          grep -q "LiveOwnerFlowTests testAGuestWalksAnswersSavesAndKeepsTheShop\]' passed" "$RUNNER_TEMP/tests.log"
          grep -q "LiveReportPDFTests testAReportLinkPrintsToAPDF\]' passed" "$RUNNER_TEMP/tests.log"
      - name: Stop the web app and the API
        if: always()
        run: |
          lsof -ti tcp:3398 | xargs kill 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/live-api.pid")" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: StandardPhysicsTests.xcresult
          path: |
            apps/ios/build/StandardPhysicsTests.xcresult
            ${{ runner.temp }}/live-api.log
            ${{ runner.temp }}/live-web.log
