name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e . -e packages/contracts -e packages/fixtures -e packages/pipeline -e packages/agents -e services/api
      - run: python -m pip check
      - run: python -m pip install ruff==0.16.7
      - run: python -m ruff check .
      - run: python -m ruff check --config services/api/pyproject.toml services/api/
      - run: python -m pytest
      - run: python -m pytest services/api/tests -q
