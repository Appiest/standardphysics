name: CI

# Every check a release depends on lives in this one workflow, so the publish
# job at the bottom can name them all in `needs:` and GitHub enforces the gate:
# a commit's image reaches the tag scripts/deploy.sh pulls only after the
# Python suites, the image smoke test, the in-image Blender regressions, the
# contract drift check, the web checks and the browser flow have all passed on
# that commit.
#
# The web and contract jobs used to be a separate workflow filtered by path. A
# job cannot wait on a job in another workflow, and a workflow_run trigger
# would have to work out which of two path-filtered workflows was expected to
# run for a commit, and would publish nothing when the web one was skipped. So
# they moved here and run on every commit. The image carries the workspace, so
# a publishable commit is one whose workspace was built and tested too.
#
# The iOS workflow stays separate. The app is not in the image, and a macOS
# runner on every commit would gate nothing that ships from here.
on:
  push:
  pull_request:

jobs:
  test:
    name: Python lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e tools/loopforge -e packages/contracts -e packages/fixtures -e packages/pipeline -e packages/agents -e services/api
      - run: python -m pip check
      - run: python -m pip install ruff==0.16.7
      - run: python -m ruff check .
      - run: python -m ruff check --config services/api/pyproject.toml services/api/
      - name: Type-check contracts, pipeline, agents and the API
        run: |
          python -m pip install mypy==2.3.1
          python -m mypy
      # Both suites write a JUnit report for the skip summary. Coverage runs in
      # its own job below, so tracing never slows the suites this job gates on.
      - run: python -m pytest --junitxml=test-reports/junit-root.xml
      - run: python -m pytest services/api/tests -q --junitxml=test-reports/junit-api.xml
      - name: Summarise skipped tests
        if: ${{ !cancelled() }}
        run: |
          for suite in root api; do
            report="test-reports/junit-$suite.xml"
            if [ -f "$report" ]; then
              python scripts/skipped_tests.py "Skipped in the $suite suite" "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: python-test-reports
          path: test-reports/junit-*.xml
          retention-days: 14

  # The API suite again, under coverage, beside the test job rather than inside
  # it: tracing makes the suite about two and a half times slower, and the floors
  # still hold every release, since publish waits for this job too.
  coverage:
    name: API coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e tools/loopforge -e packages/contracts -e packages/fixtures -e packages/pipeline -e packages/agents -e services/api
      - run: python -m pip check
      - run: python -m pytest services/api/tests -q --cov --cov-report=
        env:
          COVERAGE_FILE: test-reports/.coverage
      - name: Summarise coverage
        env:
          COVERAGE_FILE: test-reports/.coverage
        run: |
          python -m coverage xml -o test-reports/coverage.xml
          {
            echo "### Python coverage"
            echo
            echo "<details><summary>Lines and branches per module</summary>"
            echo
            python -m coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      # An explicit shell turns on pipefail, so tee cannot hide the script's exit status.
      - name: Hold the service's core modules to their coverage floors
        shell: bash
        run: python scripts/coverage_floors.py test-reports/coverage.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: python-coverage
          path: test-reports/coverage.xml
          retention-days: 14

  contracts:
    name: Generated types match the contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install pydantic==2.13.5 pydantic-core==2.46.5 -e packages/contracts
      - run: npm ci
        working-directory: apps/web
      - run: npm run contracts
        working-directory: apps/web
        env:
          PYTHON: python
      - name: Fail if a contract changed without regenerating
        run: git diff --exit-code -- apps/web/src/types/contracts.ts

  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # V8 coverage slows the outlet-reach route searches in
      # wheelchair-motion.test.ts past vitest's 5 second default, so this run
      # allows 20. vitest.config.mts holds src/lib to its coverage floors.
      - run: npm run test:coverage
      - name: Summarise web coverage
        if: ${{ !cancelled() && hashFiles('apps/web/coverage/files.txt') != '' }}
        run: |
          {
            echo "### Web coverage"
            echo
            echo '```'
            cat coverage/summary.txt
            echo '```'
            echo
            echo "<details><summary>Lines and branches per file</summary>"
            echo
            echo '```'
            cat coverage/files.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  # Not in publish's needs: the reels are promotional videos rendered locally,
  # and nothing from apps/reels goes into the image or reaches production.
  reels:
    name: Reels lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reels
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/reels/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: Owner flow in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    env:
      PYTHON: python
      SP_SEED_OWNER_PASSWORD: playwright-demo-owner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install the API
        working-directory: .
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e tools/loopforge -e packages/contracts -e packages/fixtures -e packages/pipeline -e packages/agents -e services/api
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  image:
    name: Image smoke test and Blender regressions
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # packages: write lets a master push stage the image it just tested.
    # Pull requests from forks get a read-only token whatever this says, and
    # the staging step below only runs on master anyway.
    permissions:
      contents: read
      packages: write
    # The one image every later job checks or releases. candidate is its
    # repository@digest on GHCR, set only on master; image-id is the local
    # image's id, which the scan compares against the archive it loads
    # everywhere else.
    outputs:
      candidate: ${{ steps.stage.outputs.candidate }}
      image-id: ${{ steps.tested.outputs.image-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The Blender download and the Next build dominate a cold build, so every
      # layer is cached in GitHub's cache and a code-only change rebuilds just
      # the layers after the source is copied.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: standardphysics:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the id of the image under test
        id: tested
        run: echo "image-id=$(docker image inspect --format '{{.Id}}' standardphysics:ci)" >> "$GITHUB_OUTPUT"
      # Accounts, then a real RoomPlan bedroom through the worker, the
      # assessment and Blender, then the workspace. The bedroom takes seconds;
      # the limit is for a worker that hangs.
      - run: scripts/smoke_image.sh standardphysics:ci
        timeout-minutes: 10
      # The Python job has no Blender, so the export, render and bake
      # regressions skip there. This image has the pinned Blender, and the
      # script fails if any of them skip for want of it.
      - run: scripts/test_blender_in_image.sh standardphysics:ci
        timeout-minutes: 12
      # The bytes that passed both are pushed now, under a candidate tag that
      # scripts/deploy.sh never pulls, so the publish job can release this
      # exact image without rebuilding it or moving gigabytes between jobs.
      # The owner is lowercased because registry names must be. The pushed
      # digest is the job's candidate output, so the scan and publish name the
      # image by content rather than by a tag that a re-run could move.
      - name: Stage the tested image as a release candidate
        id: stage
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/standardphysics"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag standardphysics:ci "$repository:candidate-$GITHUB_SHA"
          docker push --quiet "$repository:candidate-$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$repository:candidate-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          echo "candidate=$repository@$digest" >> "$GITHUB_OUTPUT"
      # Branches and pull requests push nothing, so the scan gets the same image
      # as an archive instead. It is kept for a day: only the scan reads it.
      - name: Archive the tested image for the scan
        if: steps.stage.outcome == 'skipped'
        run: docker save standardphysics:ci | zstd -T0 -3 -o "$RUNNER_TEMP/standardphysics.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.stage.outcome == 'skipped'
        with:
          name: tested-image
          path: ${{ runner.temp }}/standardphysics.tar.zst
          compression-level: 0
          retention-days: 1

  # Secrets anywhere in the history, and known vulnerabilities in the pinned
  # Python and web dependencies. The scanners are downloaded at pinned versions
  # and checked against pinned sha256 sums, so a release moved upstream cannot
  # change what runs here. .gitleaksignore names each false positive by
  # fingerprint, and nothing else.
  #
  # Both this job and the image scan below are in publish's needs, so a found
  # secret or a fixable critical vulnerability stops the release. An advisory
  # published against an unchanged dependency is fixed by bumping it, which is
  # an ordinary change that has to pass like any other.
  supply-chain:
    name: Secrets and dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan every commit for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # The history of the commit being released, not every branch the full
          # checkout fetched: a feature branch's commits are scanned when it merges.
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="HEAD" .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # --no-deps because the lock already names every package the image
      # installs, and --disable-pip because nothing needs installing to read it.
      - name: Audit the Python dependencies the image installs
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement requirements.lock --no-deps --disable-pip --progress-spinner off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Audit the workspace's production dependencies
        working-directory: apps/web
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  # The image the image job tested, scanned with grype: the candidate by digest
  # straight from GHCR on master, and the archived image everywhere else, whose
  # id is checked against the one the image job recorded before it is scanned.
  # It fails on a critical vulnerability only when a fixed version exists,
  # because one without a fix gives nobody anything to do.
  image-vulnerabilities:
    name: Critical vulnerabilities with a fix in the image
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE: ${{ needs.image.outputs.candidate }}
      TESTED_IMAGE_ID: ${{ needs.image.outputs.image-id }}
    steps:
      - name: Install grype
        env:
          GRYPE_VERSION: 0.119.0
          GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
        run: |
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$archive" "https://github.com/anchore/grype/releases/download/v$GRYPE_VERSION/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "$GRYPE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype
      - name: Scan the candidate by digest
        if: env.CANDIDATE != ''
        env:
          GRYPE_REGISTRY_AUTH_AUTHORITY: ghcr.io
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: '"$RUNNER_TEMP/grype" "registry:$CANDIDATE" --only-fixed --fail-on critical'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.CANDIDATE == ''
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - name: Scan the archived image
        if: env.CANDIDATE == ''
        run: |
          zstd -dc "$RUNNER_TEMP/standardphysics.tar.zst" | docker load
          loaded_id="$(docker image inspect --format '{{.Id}}' standardphysics:ci)"
          if [ "$loaded_id" != "$TESTED_IMAGE_ID" ]; then
            echo "the archive holds $loaded_id, but the image job tested $TESTED_IMAGE_ID" >&2
            exit 1
          fi
          "$RUNNER_TEMP/grype" "docker:standardphysics:ci" --only-fixed --fail-on critical

  # A master commit whose every check passed gets its candidate retagged as
  # ghcr.io/<owner>/standardphysics:<sha>, the tag scripts/deploy.sh pulls.
  # The candidate is named by the digest the image job pushed and the scan
  # read. --prefer-index=false copies the manifest as it is instead of wrapping
  # it in a new index, and the step fails if the released digest differs.
  publish:
    name: Publish the tested image to GHCR
    needs: [test, coverage, contracts, web, e2e, image, supply-chain, image-vulnerabilities]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: ${{ needs.image.outputs.candidate }}
        run: |
          repository="${CANDIDATE%@*}"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --prefer-index=false --tag "$repository:$GITHUB_SHA" "$CANDIDATE"
          digest="$(docker buildx imagetools inspect "$repository:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          if [ "$repository@$digest" != "$CANDIDATE" ]; then
            echo "published $repository@$digest, but the tested candidate is $CANDIDATE" >&2
            exit 1
          fi
          echo "Published \`$repository:$GITHUB_SHA\` as \`$repository@$digest\`" >> "$GITHUB_STEP_SUMMARY"
