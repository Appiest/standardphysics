name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -e packages/contracts -e packages/fixtures -e packages/pipeline -e "packages/agents[notebook]" -e "services/api[test]" pytest
      - run: python -c "import numpy, scipy, pydantic; print('deps ok')"
      - run: python -m pip install ruff==0.16.7
      - run: python -m ruff check .
      - run: python -m ruff check --config services/api/pyproject.toml services/api/
      - run: python -m pytest
      - run: python -m pytest packages/agents -q
      - run: python -m pytest services/api/tests -q
