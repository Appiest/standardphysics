[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "standardphysics-api"
version = "0.1.0"
description = "Upload, pipeline jobs and the workspace API. Lane D."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "email-validator==2.3.0",
  "uvicorn==0.52.4",
  "standardphysics-contracts",
  "standardphysics-fixtures",
  "standardphysics-pipeline",
  "standardphysics-agents",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["standardphysics_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]

[tool.ruff.lint.per-file-ignores]
# Tests read better as tables of short assertions than as wrapped paragraphs.
# The rules that catch real defects still apply to them: F, I and C90.
"**/tests/**" = ["E501", "E701", "E702"]

[tool.ruff.lint.isort]
# Both configs must agree, or a fix run under one undoes the other. conftest is
# named because the two runs resolve it differently otherwise: from services/api
# it sits beside the package and reads as first-party, from the root it does not,
# so each fix moved the import back where the other config had just taken it.
known-first-party = ["standardphysics_api", "conftest"]

[tool.ruff.lint.mccabe]
max-complexity = 10
