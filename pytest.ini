[pytest]
testpaths = tests packages/contracts/tests packages/agents/tests packages/pipeline/tests scripts/tests scripts/shop_pilot/tests tools/loopforge/tests scripts/finetune
pythonpath = packages/contracts packages/fixtures packages/pipeline packages/agents services/api tools/loopforge/src tests/support
addopts = -p offline_network
markers =
    network: reaches a real host; skipped unless SP_ALLOW_NETWORK_TESTS=1 (see tests/support/offline_network.py)
