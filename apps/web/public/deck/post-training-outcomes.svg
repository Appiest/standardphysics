<title id="title">Post-training outcomes on held-out room-layout variants</title>
<desc id="desc">Four model checkpoints are compared on 260 attempts each: hard-rule pass rate, accepted-fix rate, and per-attempt share that cleared every fixable finding. Hard-rule pass rises after training, while acceptance and complete-clear rates do not improve.</desc>
