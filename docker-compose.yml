# Two containers from one image: the workspace people open, and the API that
# holds the scans. Bring it up with `docker compose up --build`, then open
# http://localhost:3000.
#
# The image is built once, by the api service, and the web service runs the
# same tag. SP_API_ORIGIN has to be a build argument rather than only an
# environment variable: `next build` writes the /api rewrite destination into
# the build, so a web container given it at runtime alone would proxy the
# browser's /api requests to its own 127.0.0.1:8787, where nothing listens.
services:
  api:
    build:
      context: .
      args:
        SP_API_ORIGIN: http://api:8787
    image: standardphysics:local
    command: ["api"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SP_API_PORT: "8787"
      SP_DATA_DIR: /data
      # Set this to seed a sample shop and a demo account to sign in as.
      SP_SEED_SAMPLE_SHOP: "${SP_SEED_SAMPLE_SHOP:-}"
      SP_SEED_OWNER_EMAIL: "${SP_SEED_OWNER_EMAIL:-demo@standardphysics.app}"
      SP_SEED_OWNER_PASSWORD: "${SP_SEED_OWNER_PASSWORD:-}"
    volumes:
      - scans:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: standardphysics:local
    command: ["web"]
    restart: unless-stopped
    environment:
      PORT: "3000"
      SP_API_ORIGIN: http://api:8787
    ports:
      - "3000:3000"
    # The image's own healthcheck asks port 8787 for the API's /health, which
    # this container does not serve, so it gets one for the port it does.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  scans:
