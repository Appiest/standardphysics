[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "standardphysics-pipeline"
version = "0.1.0"
description = "Scan to measured model. Lane B."
requires-python = ">=3.11"
dependencies = [
  "standardphysics-contracts",
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.7",
  "Pillow>=10.0",
  "fast-simplification>=0.2.0",
]

[project.optional-dependencies]
reconstruction = ["numba>=0.61", "opencv-python-headless>=4.10", "trimesh>=4.5"]
# The DeepFusion splat model. Heavy, and nothing in the API path imports it,
# so it stays out of the default install and its tests skip without it.
splats = ["torch>=2.2"]

[tool.hatch.build.targets.wheel]
packages = ["standardphysics_pipeline"]
