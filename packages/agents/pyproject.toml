[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "standardphysics-agents"
version = "0.1.0"
description = "Rules, checks, the router, the fix agent and the evaluation gate. Lane C."
requires-python = ">=3.11"
dependencies = [
  "standardphysics-contracts",
  "standardphysics-pipeline",
  "pydantic>=2.7",
  "openai>=1.40",
  "pillow>=10",
]

[project.optional-dependencies]
observability = ["weave>=0.51", "wandb>=0.18"]
notebook = ["marimo>=0.24"]
replay = ["imageio-ffmpeg>=0.5"]

[project.scripts]
standardphysics-agents = "standardphysics_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["standardphysics_agents"]

[tool.hatch.build.targets.wheel.force-include]
"standardphysics_agents/rules/data" = "standardphysics_agents/rules/data"
