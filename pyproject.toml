# Tool settings shared by the whole repository. Each package carries its own
# pyproject: packages/*, services/api and tools/loopforge.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
# What CI enforces everywhere: real defects, import order, and complexity.
#
# `E` (pycodestyle, line length among it) is selected in services/api, where the
# code already holds that line. The older packages carry about eighty long lines
# that predate any linting. Wrapping them is a separate change, and gating CI on
# it today would mean a red build nobody caused.
select = ["F", "I", "C90"]

[tool.ruff.lint.isort]
# Both configs must agree, or a fix run under one undoes the other. conftest is
# named because the two runs resolve it differently otherwise: from services/api
# it sits beside the package and reads as first-party, from the root it does not,
# so each fix moved the import back where the other config had just taken it.
known-first-party = ["standardphysics_api", "conftest"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
# CI measures the API suite (see the test job in .github/workflows/ci.yml).
# Packages are named by import name rather than listed as `source` folders:
# coverage.xml writes each file relative to the `source` folder it sits in, so
# every package's __init__.py became "__init__.py" and overwrote the others.
# With source_pkgs and relative_files, the paths are the checkout's own, which
# scripts/coverage_floors.py names modules by. The scripts folder is left out:
# most of it is one-off research tooling. Only the API is traced: the floors are
# on its modules, and tracing the pipeline's geometry, which every processed scan
# runs through, took the API suite from about 17 minutes to 60.
branch = true
relative_files = true
source_pkgs = ["standardphysics_api"]

[tool.coverage.report]
skip_empty = true
precision = 1

[tool.mypy]
files = [
    "packages/contracts/standardphysics_contracts",
    "packages/pipeline/standardphysics_pipeline",
    "packages/agents/standardphysics_agents",
    "services/api/standardphysics_api",
]
mypy_path = "packages/contracts:packages/pipeline:packages/agents:packages/fixtures:services/api"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["standardphysics_fixtures.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# scipy ships no inline types, and scipy-stubs would be one more pin to keep in step.
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Blender's own modules exist only inside Blender's bundled Python, where the
# scripts under standardphysics_pipeline/blender_scripts run.
module = ["bpy", "bpy.*", "bpy_extras.*", "bmesh", "bmesh.*", "mathutils", "mathutils.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Blender runs its scripts from their own folder, so they import build_glb as a
# top-level sibling. That file is checked under its package name instead.
module = ["build_glb"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional or untyped extras: torch backs the splat experiments, numba and
# fast_simplification speed up texturing, imageio_ffmpeg encodes evaluation
# videos, and trimesh loads scan meshes. None ships types CI can check against.
module = ["torch", "torch.*", "numba", "fast_simplification", "imageio_ffmpeg", "trimesh", "trimesh.*"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
# Optional names passed to dict.get, and a colour built with tuple(...).
module = ["standardphysics_pipeline.blender_scripts.build_glb"]
disable_error_code = ["arg-type", "return-value"]

[[tool.mypy.overrides]]
# capture_to_room passed on without narrowing the Optional.
module = ["standardphysics_pipeline.object_shapes"]
disable_error_code = ["arg-type"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true
